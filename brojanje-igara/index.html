<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Brojanje poena i pobjeda za Uno, Remi, Tablić i druge kartaške igre.">
<meta name="theme-color" content="#0E3B2D" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C3326" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brojanje igara">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Brojanje igara</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Serif+Display&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a felt-green card table opens the landing; the app itself is one narrow column of game cards and a scoreboard, forms in bottom sheets. */
:root {
  --bg: #F3F5EF;
  --surface: #FFFFFF;
  --sheet: #F3F5EF;
  --field: #FFFFFF;
  --ink: #0F221B;
  --ink2: rgba(15, 34, 27, .66);
  --ink3: rgba(15, 34, 27, .34);
  --line: rgba(15, 34, 27, .12);
  --fill: rgba(15, 34, 27, .07);
  --seg-on: #FFFFFF;
  --accent: #15704C;
  --on-accent: #FFFFFF;
  --accent-soft: rgba(21, 112, 76, .12);
  --danger: #CF3030;
  --gold: #9A6B00;
  --gold-bg: #FBEDBF;
  --felt: #0E3B2D;
  --felt-hi: #1B6349;
  --on-felt: #F4F1E4;
  --on-felt2: rgba(244, 241, 228, .72);
  --card: #FFFDF6;
  --card-ink: #17211D;
  --card-red: #D8342F;
  --chip: #F2C230;
  --bar: rgba(243, 245, 239, .84);
  --shadow: 0 1px 2px rgba(15, 34, 27, .06), 0 8px 24px rgba(15, 34, 27, .08);
  --shadow-lg: 0 18px 50px rgba(0, 0, 0, .28);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  --suits: "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols 2", "DejaVu Sans", sans-serif;
  --r-card: 20px;
  --r-ctl: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09130F; --surface: #13211B; --sheet: #13211B; --field: #1D2E27;
    --ink: #EDF2EA; --ink2: rgba(237, 242, 234, .66); --ink3: rgba(237, 242, 234, .34);
    --line: rgba(237, 242, 234, .13); --fill: rgba(237, 242, 234, .09); --seg-on: rgba(237, 242, 234, .2);
    --accent: #3CC48A; --on-accent: #06140E; --accent-soft: rgba(60, 196, 138, .16);
    --danger: #FF6F64; --gold: #F2C230; --gold-bg: rgba(242, 194, 48, .16);
    --felt: #0C3326; --felt-hi: #17553F; --on-felt: #F4F1E4; --on-felt2: rgba(244, 241, 228, .72);
    --card: #FFFDF6; --card-ink: #17211D; --card-red: #D8342F; --chip: #F2C230;
    --bar: rgba(9, 19, 15, .82);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
    --shadow-lg: 0 18px 50px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09130F; --surface: #13211B; --sheet: #13211B; --field: #1D2E27;
  --ink: #EDF2EA; --ink2: rgba(237, 242, 234, .66); --ink3: rgba(237, 242, 234, .34);
  --line: rgba(237, 242, 234, .13); --fill: rgba(237, 242, 234, .09); --seg-on: rgba(237, 242, 234, .2);
  --accent: #3CC48A; --on-accent: #06140E; --accent-soft: rgba(60, 196, 138, .16);
  --danger: #FF6F64; --gold: #F2C230; --gold-bg: rgba(242, 194, 48, .16);
  --felt: #0C3326; --felt-hi: #17553F; --on-felt: #F4F1E4; --on-felt2: rgba(244, 241, 228, .72);
  --card: #FFFDF6; --card-ink: #17211D; --card-red: #D8342F; --chip: #F2C230;
  --bar: rgba(9, 19, 15, .82);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
  --shadow-lg: 0 18px 50px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 17px; line-height: 1.4;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
body.on-landing::before { background: var(--felt); }
html.locked, html.locked body { overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { border: 0; background: none; padding: 0; cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
p { margin: 0; }
.suit { font-family: var(--suits); line-height: 1; }

.gutter {
  max-width: 1040px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.wrap {
  max-width: 600px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}

/* ---------- Landing ---------- */
.hero {
  margin-top: calc(-1 * env(safe-area-inset-top, 0px));
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-bottom: 56px;
  color: var(--on-felt);
  background:
    radial-gradient(120% 90% at 78% 8%, var(--felt-hi) 0%, transparent 62%),
    radial-gradient(80% 60% at 0% 100%, rgba(0, 0, 0, .28) 0%, transparent 70%),
    var(--felt);
  overflow: hidden;
}
.hero-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.brand { display: inline-flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 18px;
  background: var(--card); color: var(--card-ink); transform: rotate(-6deg);
}
.ghost { border: 1.5px solid rgba(244, 241, 228, .34); color: var(--on-felt); border-radius: 22px; padding: 8px 16px; font-weight: 600; font-size: 15px; }
.ghost:active { background: rgba(244, 241, 228, .12); }
.hero-grid { display: grid; gap: 40px; align-items: center; margin-top: 36px; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--chip);
}
.eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--chip); }
.hero h1 { font-size: clamp(44px, 12vw, 76px); line-height: .96; font-weight: 800; letter-spacing: -.035em; margin-top: 16px; }
.hero h1 em { font-style: normal; color: var(--chip); display: block; }
.hero-sub { font-size: 19px; line-height: 1.45; color: var(--on-felt2); margin-top: 20px; max-width: 30em; }
.cta {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; padding: 0 30px; margin-top: 28px;
  background: var(--chip); color: #1B1502; border-radius: 30px; font-weight: 700; font-size: 18px;
  box-shadow: 0 10px 30px rgba(242, 194, 48, .28); transition: transform .15s ease;
}
.cta:hover { transform: translateY(-2px); }
.cta:active { transform: scale(.97); }
.cta svg { width: 18px; height: 18px; }
.hero-note { font-size: 14px; color: var(--on-felt2); margin-top: 14px; }

.hero-art { position: relative; height: 300px; max-width: 420px; width: 100%; margin: 0 auto; }
.pcard {
  position: absolute; width: 124px; height: 176px; border-radius: 14px; background: var(--card); color: var(--card-ink);
  box-shadow: var(--shadow-lg); padding: 10px 12px; font-family: var(--display); font-weight: 800; font-size: 24px; line-height: 1;
}
.pcard.red { color: var(--card-red); }
.pcard small { display: block; font-family: var(--suits); font-size: 18px; margin-top: 3px; font-weight: 400; }
.pcard i { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--suits); font-style: normal; font-size: 62px; font-weight: 400; }
.pcard.c1 { left: 2%; top: 46px; transform: rotate(-16deg); }
.pcard.c2 { left: 22%; top: 18px; transform: rotate(-3deg); }
.pcard.c3 { left: 42%; top: 34px; transform: rotate(11deg); }
.mock {
  position: absolute; right: 0; bottom: 0; width: min(250px, 66%); border-radius: 18px; padding: 14px 16px 16px;
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow-lg); transform: rotate(2deg);
}
.mock-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--ink2); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.mock-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: baseline; margin-top: 10px; font-weight: 600; font-size: 15px; }
.mock-row b { font-family: var(--display); font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.mock-row span.bar { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.mock-row span.bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.mock-row.lead span.bar i { background: var(--chip); }
@media (min-width: 860px) {
  .hero { padding-bottom: 84px; }
  .hero-grid { grid-template-columns: 1.1fr .9fr; margin-top: 64px; }
  .hero-art { height: 360px; margin: 0; }
  .pcard { width: 150px; height: 212px; font-size: 28px; }
  .pcard i { font-size: 76px; }
}

.sec { padding-block: 56px 0; }
.sec h2 { font-size: clamp(28px, 6vw, 40px); line-height: 1.05; font-weight: 800; letter-spacing: -.03em; }
.sec-lede { color: var(--ink2); margin-top: 10px; max-width: 34em; }
.steps { list-style: none; margin: 28px 0 0; padding: 0; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.steps li { background: var(--surface); border-radius: var(--r-card); padding: 22px; box-shadow: var(--shadow); }
.steps .n {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: 18px; background: var(--felt); color: var(--chip);
}
.steps h3 { font-size: 20px; font-weight: 700; letter-spacing: -.015em; margin-top: 16px; }
.steps p { color: var(--ink2); font-size: 16px; margin-top: 6px; }

.picks { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-top: 26px; }
.pick {
  position: relative; overflow: hidden; text-align: left; border-radius: var(--r-card); padding: 16px 16px 18px; min-height: 124px;
  color: #fff; background: linear-gradient(150deg, var(--c), color-mix(in srgb, var(--c) 62%, #000));
  display: flex; flex-direction: column; justify-content: flex-end; transition: transform .15s ease;
}
.pick:hover { transform: translateY(-3px); }
.pick:active { transform: scale(.97); }
.pick .wm { position: absolute; right: -8px; top: -14px; font-size: 96px; opacity: .2; }
.pick b { font-family: var(--display); font-size: 22px; font-weight: 700; letter-spacing: -.015em; }
.pick span.how { font-size: 13.5px; opacity: .86; margin-top: 2px; }

.feats { display: grid; gap: 28px 32px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-top: 30px; }
.feat { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: start; }
.feat-ic { grid-row: span 2; width: 44px; height: 44px; border-radius: 13px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.feat-ic svg { width: 22px; height: 22px; }
.feat h3 { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.feat p { color: var(--ink2); font-size: 16px; }

.closer {
  margin-top: 64px; border-radius: 28px; padding: 44px 24px; text-align: center; color: var(--on-felt);
  background: radial-gradient(90% 120% at 50% 0%, var(--felt-hi) 0%, transparent 70%), var(--felt);
}
.closer h2 { font-size: clamp(28px, 7vw, 44px); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
.closer p { color: var(--on-felt2); margin-top: 10px; }
.foot { text-align: center; color: var(--ink2); font-size: 14px; padding-block: 28px 40px; }

/* ---------- App chrome ---------- */
.nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; justify-content: space-between;
  min-height: 56px; margin: 0 -8px; padding: 0 8px;
  background: var(--bar);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
}
.nav .brand { color: var(--ink); font-size: 16px; }
.nav .brand-mark { width: 28px; height: 28px; font-size: 16px; background: var(--felt); color: var(--chip); }
.nav-btn { color: var(--accent); font-weight: 600; min-height: 44px; padding: 0 4px; display: inline-flex; align-items: center; gap: 4px; }
.nav-btn:active { opacity: .5; }
.nav-btn svg { width: 11px; height: 18px; }
.round-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: inline-grid; place-items: center; box-shadow: var(--shadow); }
.round-btn:active { transform: scale(.92); }
.round-btn svg { width: 16px; height: 16px; }

.page-title { font-size: 40px; line-height: 1; font-weight: 800; letter-spacing: -.035em; margin-top: 10px; }
.lede { color: var(--ink2); font-size: 16px; margin-top: 8px; }
.section-label { font-size: 13px; font-weight: 600; color: var(--ink2); text-transform: uppercase; letter-spacing: .06em; margin: 30px 4px 10px; }
.footnote { font-size: 14px; color: var(--ink2); margin: 12px 4px 0; }

/* Game cards on the home screen */
.games { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 22px; }
@media (max-width: 359px) { .games { grid-template-columns: 1fr; } }
.gcard {
  position: relative; overflow: hidden; text-align: left; border-radius: var(--r-card); padding: 14px 14px 16px; min-height: 168px;
  color: #fff; background: linear-gradient(150deg, var(--c), color-mix(in srgb, var(--c) 60%, #000));
  box-shadow: var(--shadow); display: flex; flex-direction: column; transition: transform .15s ease;
}
.gcard:hover { transform: translateY(-2px); }
.gcard:active { transform: scale(.97); }
.gcard .wm { position: absolute; right: -14px; bottom: -26px; font-size: 130px; opacity: .17; }
.gcard-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.gcard-ic { width: 36px; height: 36px; border-radius: 11px; background: rgba(255, 255, 255, .22); display: grid; place-items: center; font-size: 20px; }
.badge { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; background: rgba(255, 255, 255, .24); border-radius: 8px; padding: 3px 7px; }
.gcard-name { font-family: var(--display); font-size: 24px; line-height: 1.05; font-weight: 700; letter-spacing: -.02em; margin-top: auto; padding-top: 18px; overflow-wrap: anywhere; position: relative; }
.gcard-meta { font-size: 13.5px; opacity: .88; margin-top: 4px; position: relative; }
.gcard-status { font-size: 14px; font-weight: 700; margin-top: 8px; position: relative; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gcard.new {
  background: none; color: var(--accent); box-shadow: none; border: 2px dashed color-mix(in srgb, var(--accent) 45%, transparent);
  align-items: center; justify-content: center; gap: 10px; font-weight: 700;
}
.gcard.new .plus { width: 44px; height: 44px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; }
.gcard.new svg { width: 18px; height: 18px; }

/* Game header */
.ghead {
  position: relative; overflow: hidden; border-radius: 24px; padding: 22px 20px; margin-top: 6px; color: #fff;
  background: linear-gradient(150deg, var(--c), color-mix(in srgb, var(--c) 58%, #000)); box-shadow: var(--shadow);
}
.ghead .wm { position: absolute; right: -18px; top: -36px; font-size: 180px; opacity: .16; }
.ghead h1 { position: relative; font-size: 36px; line-height: 1; font-weight: 800; letter-spacing: -.03em; overflow-wrap: anywhere; }
.ghead p { position: relative; font-size: 15px; opacity: .9; margin-top: 8px; }

.banner { margin-top: 14px; border-radius: var(--r-card); padding: 16px; background: var(--gold-bg); display: flex; align-items: center; gap: 14px; }
.banner-crown { color: var(--gold); flex: none; }
.banner-crown svg { width: 32px; height: 32px; display: block; }
.banner-title { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: -.015em; overflow-wrap: anywhere; }
.banner-sub { font-size: 14px; color: var(--ink2); margin-top: 2px; }

/* Scoreboard */
.group { background: var(--surface); border-radius: var(--r-card); overflow: hidden; margin-top: 14px; box-shadow: var(--shadow); }
.section-label + .group { margin-top: 0; }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; min-height: 68px; position: relative; width: 100%; text-align: left; }
.row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: 16px; height: 1px; background: var(--line); }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 14px; color: var(--ink3); font-variant-numeric: tabular-nums; }
.rank.first { background: var(--chip); color: #1B1502; }
.row.leader { background: linear-gradient(90deg, var(--gold-bg), transparent 70%); }
.avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 17px; color: #fff; background: var(--c); }
.avatar.sm { width: 28px; height: 28px; font-size: 13px; }
.progress { height: 5px; border-radius: 3px; background: var(--fill); margin-top: 7px; overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 3px; background: var(--c); transition: width .35s ease; }
.total { flex: none; font-family: var(--display); font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.03em; min-width: 2ch; text-align: right; }
.plus-one { flex: none; min-width: 56px; height: 40px; padding: 0 14px; border-radius: 20px; background: var(--accent); color: var(--on-accent); font-weight: 800; font-family: var(--display); }
.plus-one:active { transform: scale(.92); }

/* Buttons */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 56px;
  border-radius: 28px; font-weight: 700; padding: 0 18px; margin-top: 16px; background: var(--accent); color: var(--on-accent);
}
.btn:active { transform: scale(.98); opacity: .9; }
.btn svg { width: 16px; height: 16px; }
.btn.gray { background: var(--fill); color: var(--ink); }
.btn.danger-text { background: none; color: var(--danger); font-weight: 600; min-height: 48px; }
.btn.danger { background: var(--danger); color: #fff; }

/* History */
.hist { align-items: flex-start; min-height: 0; padding-block: 13px; }
.hist-title { font-size: 13px; font-weight: 600; color: var(--ink2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.chip { font-size: 14px; background: var(--fill); border-radius: 9px; padding: 4px 9px; font-variant-numeric: tabular-nums; max-width: 100%; overflow-wrap: anywhere; }
.chip b { font-weight: 700; }
.chip .neg { color: var(--danger); }
.del { flex: none; width: 32px; height: 32px; border-radius: 50%; color: var(--ink3); display: grid; place-items: center; margin-right: -6px; }
.del:hover { background: var(--fill); color: var(--ink2); }
.del svg { width: 12px; height: 12px; }

/* ---------- Sheets ---------- */
.backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(4, 12, 9, .55); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease; }
.sheet {
  width: 100%; max-width: 600px; max-height: 92%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--sheet); border-radius: 26px 26px 0 0; box-shadow: var(--shadow-lg);
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  animation: rise .3s cubic-bezier(.2, .8, .2, 1);
}
@media (min-width: 680px) { .backdrop { align-items: center; } .sheet { border-radius: 26px; max-height: 86%; } }
.sheet-bar { position: sticky; top: 0; z-index: 1; background: var(--sheet); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 60px; margin: 0 -2px; }
.sheet-bar h2 { font-size: 19px; font-weight: 700; letter-spacing: -.015em; text-align: center; }
.sheet-bar .nav-btn:last-child { justify-self: end; }
.sheet-bar .nav-btn:first-child { color: var(--ink2); font-weight: 500; }
.sheet .group { background: var(--field); margin-top: 0; box-shadow: none; border-radius: 16px; }
.sheet .section-label { margin-top: 22px; }
.sheet .section-label:first-of-type { margin-top: 4px; }
.field { display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 52px; position: relative; }
.field + .field::before { content: ""; position: absolute; top: 0; right: 0; left: 16px; height: 1px; background: var(--line); }
.field label { flex: none; }
.field input { flex: 1; min-width: 0; border: 0; background: none; padding: 13px 0; outline: none; }
.field input::placeholder { color: var(--ink3); }
.field input.num { text-align: right; font-variant-numeric: tabular-nums; }
.field .who { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.field input.pts { flex: none; width: 96px; text-align: right; font-family: var(--display); font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.sign { flex: none; width: 40px; height: 34px; border-radius: 10px; background: var(--fill); color: var(--ink2); font-weight: 700; }
.sign:active { opacity: .6; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; background: var(--fill); border-radius: 13px; padding: 3px; }
.seg button { min-height: 38px; border-radius: 10px; font-size: 15px; font-weight: 500; padding: 4px 6px; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); font-weight: 700; }
.seg-block { margin-top: 10px; }
.tpl { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: none; }
.tpl::-webkit-scrollbar { display: none; }
.tpl button { flex: none; display: flex; align-items: center; gap: 8px; background: var(--field); border-radius: 14px; padding: 8px 14px 8px 8px; font-weight: 600; font-size: 15px; }
.tpl button:active { opacity: .6; }
.tile { flex: none; width: 30px; height: 30px; border-radius: 9px; background: var(--c); color: #fff; display: grid; place-items: center; font-size: 17px; font-family: var(--suits); line-height: 1; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px 16px; }
.swatch { width: 32px; height: 32px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-size: 17px; font-family: var(--suits); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--field), 0 0 0 4.5px var(--c); }
.swatch.icon { background: var(--fill); color: var(--ink); }
.swatch.icon[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--field), 0 0 0 4.5px var(--accent); }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 2px 0; }
.suggest button { background: var(--accent-soft); color: var(--accent); border-radius: 16px; padding: 6px 13px; font-size: 15px; font-weight: 600; }
.add-row { color: var(--accent); font-weight: 600; }
.error { color: var(--danger); font-size: 14px; font-weight: 600; margin: 12px 4px 0; }
.confirm-text { text-align: center; color: var(--ink2); font-size: 16px; margin: 4px 12px 0; }

/* Toast */
.toast {
  position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 14px; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--bg); border-radius: 26px; padding: 10px 10px 10px 20px; font-size: 15px; font-weight: 600;
  box-shadow: var(--shadow-lg); animation: toast-in .25s ease;
}
.toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast button { flex: none; color: #1B1502; font-weight: 700; background: var(--chip); border-radius: 18px; padding: 7px 14px; }


/* ---------- Game themes: the game screen takes on the look of the game being played ---------- */
body.t-colors {
  --bg: #111214; --surface: #1D1F23; --sheet: #1D1F23; --field: #2A2D33;

  --line: rgba(255, 255, 255, .14); --fill: rgba(255, 255, 255, .1); --seg-on: rgba(255, 255, 255, .22);

  --danger: #FF7468; --gold: #F7C600; --gold-bg: rgba(247, 198, 0, .15); --bar: rgba(17, 18, 20, .84);

  --accent: #B3261E; --on-accent: #FFFFFF; --accent-soft: rgba(179, 38, 30, .1);
  --danger: #8F1D17; --gold: #7A5C00; --gold-bg: #F1DF9E; --bar: rgba(233, 224, 204, .86);
  --shadow: 0 1px 2px rgba(30, 26, 21, .1), 0 8px 22px rgba(30, 26, 21, .1); color-scheme: light;

body.t-felt {
  --bg: #0D3829; --surface: #14503B; --sheet: #124634; --field: #1A5C45;
  --ink: #F4F1E4; --ink2: rgba(244, 241, 228, .74); --ink3: rgba(244, 241, 228, .42);
  --line: rgba(244, 241, 228, .16); --fill: rgba(244, 241, 228, .1); --seg-on: rgba(244, 241, 228, .24);
  --accent: #F2C230; --on-accent: #1B1502; --accent-soft: rgba(242, 194, 48, .16);

}
body.t-dice {
  --bg: #E8EDF6; --surface: #FFFFFF; --sheet: #E8EDF6; --field: #FFFFFF;
  --ink: #13203B; --ink2: rgba(19, 32, 59, .68); --ink3: rgba(19, 32, 59, .36);
  --line: rgba(19, 32, 59, .13); --fill: rgba(19, 32, 59, .07); --seg-on: #FFFFFF;
  --accent: #1D4FC4; --on-accent: #FFFFFF; --accent-soft: rgba(29, 79, 196, .1);
  --danger: #C7302B; --gold: #8A6A00; --gold-bg: #FBEDBF; --bar: rgba(232, 237, 246, .86);

}
body.t-cards .ghead h1, body.t-cards .total, body.t-cards .banner-title, body.t-cards .sheet-bar h2, body.t-cards .field input.pts { font-weight: 400; letter-spacing: 0; }
body.t-cards .rank, body.t-cards .plus-one { font-family: var(--body); }

/* Four colours (Uno) */
.gh-colors { background: #1D1F23; padding-right: 150px; min-height: 136px; }
.gh-colors::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: linear-gradient(90deg, #E5322D 0 25%, #F7C600 25% 50%, #2FA84F 50% 75%, #1F6FD6 75%); }
.gh-colors h1 { transform: rotate(-3deg) skewX(-8deg); transform-origin: left center; text-shadow: 3px 3px 0 #000; }
.deck, .hand { position: absolute; right: 12px; top: 20px; width: 128px; height: 100px; }
.deck span {
  position: absolute; top: 6px; width: 52px; height: 78px; border-radius: 9px; background: var(--c); color: var(--ct, #fff); border: 3px solid #fff;
  display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 24px; box-shadow: 0 6px 14px rgba(0, 0, 0, .4);
}
.deck span:nth-child(1), .hand span:nth-child(1) { left: 0; transform: rotate(-16deg); top: 14px; }
.deck span:nth-child(2), .hand span:nth-child(2) { left: 25px; transform: rotate(-5deg); }
.deck span:nth-child(3), .hand span:nth-child(3) { left: 50px; transform: rotate(6deg); }
.deck span:nth-child(4) { left: 75px; transform: rotate(17deg); top: 14px; }
.avatar.av-colors { width: 32px; height: 44px; border-radius: 8px; border: 2.5px solid #fff; transform: rotate(-5deg); color: var(--ct, #fff); }
.avatar.av-colors.sm { width: 22px; height: 30px; border-width: 2px; border-radius: 6px; font-size: 12px; }

/* Playing cards (Remi, Belot) */
.gh-cards { background: var(--surface); color: var(--ink); text-align: center; padding: 36px 46px 28px; }
.gh-cards::before { content: ""; position: absolute; inset: 8px; border: 1.5px solid rgba(30, 26, 21, .28); border-radius: 17px; pointer-events: none; }
.gh-cards .corner { position: absolute; font-family: var(--display); font-size: 22px; line-height: 1; text-align: center; color: #B3261E; }
.gh-cards .corner.tl { left: 20px; top: 18px; }
.gh-cards .corner.br { right: 20px; bottom: 18px; transform: rotate(180deg); }
.gh-cards .corner small { display: block; font-family: var(--suits); font-size: 16px; margin-top: 2px; }
.suitrow { position: relative; font-family: var(--suits); font-size: 20px; margin-top: 14px; display: flex; justify-content: center; gap: 16px; line-height: 1; }
.suitrow b { color: #B3261E; font-weight: 400; }
.avatar.av-card {
  width: 32px; height: 44px; border-radius: 6px; background: #FFFDF6; border: 1.5px solid rgba(30, 26, 21, .3); color: #1E1A15;
  align-content: center; gap: 1px; font-weight: 400; font-size: 17px; line-height: 1; box-shadow: 0 1px 2px rgba(0, 0, 0, .12);
}

.avatar.av-card.sm { width: 22px; height: 30px; font-size: 13px; border-radius: 4px; }
.avatar.av-card.sm i { display: none; }

/* Green table (Tablić) */
.gh-felt { background: radial-gradient(120% 120% at 80% 0%, #1B6349, transparent 65%), #0B3023; border: 1.5px solid rgba(244, 241, 228, .16); padding-right: 140px; min-height: 136px; color: #F4F1E4; }
.hand span { position: absolute; top: 4px; width: 54px; height: 78px; border-radius: 8px; background: #FFFDF6; color: #17211D; font-family: var(--suits); font-size: 28px; display: grid; place-items: center; box-shadow: 0 6px 16px rgba(0, 0, 0, .35); }
.hand span.red { color: #D8342F; }
.avatar.av-chip { border: 3px dashed rgba(255, 255, 255, .88); box-shadow: 0 0 0 2px var(--c), 0 2px 6px rgba(0, 0, 0, .3); }
.avatar.av-chip.sm { border-width: 2px; }

/* Dice (Jamb) */
.gh-dice {
  background-color: #fff; color: #13203B; border: 1.5px solid rgba(29, 79, 196, .3);
  background-image: linear-gradient(rgba(29, 79, 196, .13) 1px, transparent 1px), linear-gradient(90deg, rgba(29, 79, 196, .13) 1px, transparent 1px);

}
.gh-dice h1 { color: #1D4FC4; }
.dice-row { position: relative; display: flex; gap: 8px; margin-top: 16px; }
.dice-row svg { width: 34px; height: 34px; filter: drop-shadow(0 2px 3px rgba(19, 32, 59, .22)); }
.dice-row svg:nth-child(odd) { transform: rotate(-7deg); }
.dice-row svg:nth-child(even) { transform: rotate(5deg); }
.avatar.av-die { background: none; border-radius: 0; }
.avatar.av-die svg { width: 100%; height: 100%; display: block; }

/* The same looks on the home screen cards */
.gc-colors { background: #17181B; }
.gc-colors::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: linear-gradient(90deg, #E5322D 0 25%, #F7C600 25% 50%, #2FA84F 50% 75%, #1F6FD6 75%); }
.gc-colors .wm { display: none; }
.gc-colors .gcard-ic { background: conic-gradient(#E5322D 0 25%, #F7C600 0 50%, #2FA84F 0 75%, #1F6FD6 0); font-size: 0; border: 2px solid #fff; }
.gc-cards { background: #FFFDF6; color: #1E1A15; box-shadow: inset 0 0 0 6px #FFFDF6, inset 0 0 0 7.5px rgba(30, 26, 21, .22), var(--shadow); }
.gc-cards .wm { color: #B3261E; opacity: .14; }
.gc-cards .gcard-ic { background: rgba(179, 38, 30, .1); color: #B3261E; }
.gc-cards .badge, .gc-dice .badge { background: rgba(30, 26, 21, .1); }
.gc-cards .gcard-name { font-family: "DM Serif Display", Georgia, serif; font-weight: 400; letter-spacing: 0; font-size: 26px; }
.gc-felt { background: radial-gradient(120% 120% at 80% 0%, #1B6349, transparent 65%), #0B3023; color: #F4F1E4; }
.gc-felt .gcard-ic { background: #F2C230; color: #1B1502; }
.gc-dice {
  background-color: #fff; color: #13203B;
  background-image: linear-gradient(rgba(29, 79, 196, .12) 1px, transparent 1px), linear-gradient(90deg, rgba(29, 79, 196, .12) 1px, transparent 1px);
  background-size: 22px 22px;
}
.gc-dice .gcard-name { color: #1D4FC4; }
.gc-dice .gcard-ic { background: rgba(29, 79, 196, .12); color: #1D4FC4; }

.tpl button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--accent); color: var(--accent); }
.tpl.pick-theme button { padding: 9px 14px; }

@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(28px); opacity: 0; } }
@keyframes toast-in { from { transform: translate(-50%, 16px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<body>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var KEY = 'brojanje-igara-v1';
  var SEEN = 'brojanje-igara-seen';
  var COLORS = ['#D63B3B', '#DB7412', '#1C9A56', '#2D6AE0', '#5B50D6', '#D4357A', '#1590A8'];
  var ICONS = ['♠', '♥', '♦', '♣', '★'];
  var TEMPLATES = [
    { name: 'Uno', theme: 'colors', icon: 1, color: 0, mode: 'points', win: 'high', target: 500, how: 'Poeni, igra se do 500' },
    { name: 'Remi', theme: 'cards', icon: 0, color: 4, mode: 'points', win: 'low', target: '', how: 'Najmanje poena pobjeđuje' },
    { name: 'Tablić', theme: 'felt', icon: 3, color: 2, mode: 'points', win: 'high', target: 101, how: 'Poeni, igra se do 101' },
    { name: 'Belot', theme: 'cards', icon: 2, color: 1, mode: 'points', win: 'high', target: 1001, how: 'Poeni, igra se do 1001' },
    { name: 'Jamb', theme: 'dice', icon: 4, color: 6, mode: 'points', win: 'high', target: '', how: 'Najviše poena pobjeđuje' },
    { name: 'Na pobjede', theme: 'plain', icon: 4, color: 3, mode: 'wins', win: 'high', target: '', how: 'Samo +1 za pobjednika' }
  ];

  var ICON = {
    plus: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M8 2v12M2 8h12"/></svg>',
    back: '<svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>',
    arrow: '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h12M10 4l5 5-5 5"/></svg>',
    x: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m1 1 10 10M11 1 1 11"/></svg>',
    crown: '<svg viewBox="0 0 28 28" fill="currentColor"><path d="M4 21h20v2.5H4zM3 8.5l5.5 4.5L14 5l5.5 8L25 8.5 23 19H5z"/></svg>',
    tally: '<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4v14M9 4v14M13 4v14M17 4v14M2.5 15 19.5 7"/></svg>',
    flag: '<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V3M5 4h11l-2.5 4L16 12H5"/></svg>',
    undo: '<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5 3 9l4 4M3 9h10a5 5 0 0 1 0 10H9"/></svg>',
    lock: '<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="14" height="9" rx="2.5"/><path d="M7.5 10V7a3.5 3.5 0 0 1 7 0v3"/></svg>'
  };

  /* ---------- Storage ---------- */
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
  function one(pid, v) { var s = {}; s[pid] = v; return s; }

  function seed() {
    var a = uid(), b = uid(), c = uid();
    return {
      games: [{
        id: uid(), name: 'Uno', icon: 1, color: 0, mode: 'points', win: 'high', target: 500, example: true,
        players: [{ id: a, name: 'Amra' }, { id: b, name: 'Tarik' }, { id: c, name: 'Lejla' }],
        rounds: [
          { id: uid(), scores: one(a, 64) }, { id: uid(), scores: one(c, 112) },
          { id: uid(), scores: one(b, 96) }, { id: uid(), scores: one(a, 87) }
        ]
      }]
    };
  }
  function read(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function write(key, val) { try { localStorage.setItem(key, val); } catch (e) { /* storage unavailable: keep everything in memory */ } }

  function load() {
    try {
      var s = JSON.parse(read(KEY) || 'null');
      if (s && Array.isArray(s.games)) return s;
    } catch (e) { /* fall through to the example */ }
    return seed();
  }
  function save() { write(KEY, JSON.stringify(state)); }

  var state = load();
  var view = { page: read(SEEN) ? 'home' : 'landing', gameId: null };
  var sheet = null;
  var toast = null;
  var toastTimer = null;

  /* ---------- Helpers ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  function fmt(n) { return (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('de-DE'); }
  function signed(n) { return (n > 0 ? '+' : '') + fmt(n); }
  function players(n) { return n + (n === 1 ? ' igrač' : ' igrača'); }
  function game(id) { return state.games.filter(function (g) { return g.id === id; })[0] || null; }
  function color(i) { return COLORS[i % COLORS.length]; }
  function suit(i) { return ICONS[i % ICONS.length] + '︎'; }
  function tile(g) { return '<span class="tile" style="--c:' + color(g.color) + '" aria-hidden="true">' + suit(g.icon) + '</span>'; }
  function initial(name) { return esc(name.trim().charAt(0).toUpperCase()); }

  function totals(g) {
    var t = {};
    g.players.forEach(function (p) { t[p.id] = 0; });
    g.rounds.forEach(function (r) {
      Object.keys(r.scores).forEach(function (pid) { if (pid in t) t[pid] += r.scores[pid]; });
    });
    return t;
  }
  function lowWins(g) { return g.mode === 'points' && g.win === 'low'; }

  /* Standing: ranks, the current leader(s) and, once the target is reached, the winner(s). */
  function standing(g) {
    var t = totals(g);
    var low = lowWins(g);
    var vals = g.players.map(function (p) { return t[p.id]; });
    var best = vals.length ? (low ? Math.min.apply(null, vals) : Math.max.apply(null, vals)) : 0;
    var rank = {};
    g.players.forEach(function (p) {
      rank[p.id] = 1 + vals.filter(function (v) { return low ? v < t[p.id] : v > t[p.id]; }).length;
    });
    var top = g.players.filter(function (p) { return t[p.id] === best; });
    var played = g.rounds.length > 0;
    var allTied = top.length === g.players.length && g.players.length > 1;
    var finished = !!g.target && played && vals.some(function (v) { return v >= g.target; });
    return {
      totals: t, rank: rank, played: played,
      leaders: played && !allTied ? top : [],
      winners: finished && !allTied ? top : [],
      finished: finished
    };
  }
  function names(list) { return list.map(function (p) { return p.name; }).join(' i '); }

  function rules(g) {
    var parts = [];
    if (g.mode === 'wins') parts.push('Broje se pobjede');
    else parts.push(g.win === 'low' ? 'Pobjeđuje najmanje poena' : 'Pobjeđuje najviše poena');
    if (g.target) parts.push(g.mode === 'points' && g.win === 'low' ? 'kraj na ' + fmt(g.target) : 'igra se do ' + fmt(g.target));
    return parts.join(' · ');
  }

  /* ---------- Themes ---------- */
  var THEMES = [['plain', 'Obični'], ['cards', 'Karte'], ['felt', 'Zeleni sto'], ['colors', 'Četiri boje'], ['dice', 'Kocke']];
  var QUAD = [['#E5322D', '#fff'], ['#F7C600', '#1B1502'], ['#2FA84F', '#fff'], ['#1F6FD6', '#fff']];
  var CHIPS = ['#C8372D', '#2A5DB8', '#1C1C1C', '#7A3FB8', '#D07A12', '#0E8A8A'];
  var PIPS = { 1: [[20, 20]], 2: [[11, 11], [29, 29]], 3: [[11, 11], [20, 20], [29, 29]], 4: [[11, 11], [29, 11], [11, 29], [29, 29]],
    5: [[11, 11], [29, 11], [20, 20], [11, 29], [29, 29]], 6: [[11, 11], [29, 11], [11, 20], [29, 20], [11, 29], [29, 29]] };

  function inferTheme(name) {
    var n = String(name || '').toLowerCase();
    if (/\buno\b/.test(n)) return 'colors';
    if (/remi|belot|poker|briškul|briskul|trešet|preferans|raub|šnops|karte/.test(n)) return 'cards';
    if (/tabli/.test(n)) return 'felt';
    if (/jamb|kock|yams/.test(n)) return 'dice';
    return 'plain';
  }
  function themeOf(g) { return g.theme || inferTheme(g.name); }
  function die(n) {
    return '<svg viewBox="0 0 40 40"><rect x="1.5" y="1.5" width="37" height="37" rx="8" fill="#fff" stroke="#13203B" stroke-width="2"/>' +
      PIPS[n].map(function (p) { return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.6" fill="#13203B"/>'; }).join('') + '</svg>';
  }
  /* A player's marker drawn in the game's own vocabulary: a colour card, a playing card, a chip or a die. */
  function avatar(theme, i, name, sm) {
    var cls = 'avatar' + (sm ? ' sm' : '');
    if (theme === 'colors') {
      var q = QUAD[i % 4];
      return '<span class="' + cls + ' av-colors" style="--c:' + q[0] + ';--ct:' + q[1] + '" aria-hidden="true">' + initial(name) + '</span>';
    }
    if (theme === 'cards') {
      return '<span class="' + cls + ' av-card' + (i % 2 ? ' red' : '') + '" aria-hidden="true">' + initial(name) + '<i>' + ICONS[i % 4] + '︎</i></span>';
    }
    if (theme === 'felt') return '<span class="' + cls + ' av-chip" style="--c:' + CHIPS[i % CHIPS.length] + '" aria-hidden="true">' + initial(name) + '</span>';
    if (theme === 'dice') return '<span class="' + cls + ' av-die" aria-hidden="true">' + die(i % 6 + 1) + '</span>';
    return '<span class="' + cls + '" style="--c:' + color(i) + '" aria-hidden="true">' + initial(name) + '</span>';
  }
  function ghead(g, theme) {
    var text = '<h1>' + esc(g.name) + '</h1><p>' + esc(rules(g)) + '</p>';
    if (theme === 'colors') {
      return '<div class="ghead gh-colors">' + text + '<div class="deck" aria-hidden="true">' +
        ['7', '+2', '0', '5'].map(function (v, i) { return '<span style="--c:' + QUAD[i][0] + ';--ct:' + QUAD[i][1] + '">' + v + '</span>'; }).join('') + '</div></div>';
    }
    if (theme === 'cards') {
      var c = initial(g.name) + '<small>' + suit(g.icon) + '</small>';
      return '<div class="ghead gh-cards"><span class="corner tl" aria-hidden="true">' + c + '</span><span class="corner br" aria-hidden="true">' + c + '</span>' + text +
        '<div class="suitrow" aria-hidden="true"><span>♠︎</span><b>♥︎</b><span>♣︎</span><b>♦︎</b></div></div>';
    }
    if (theme === 'felt') {
      return '<div class="ghead gh-felt">' + text + '<div class="hand" aria-hidden="true"><span>♣︎</span><span class="red">♦︎</span><span>♠︎</span></div></div>';
    }
    if (theme === 'dice') {
      return '<div class="ghead gh-dice">' + text + '<div class="dice-row" aria-hidden="true">' + [5, 3, 6, 1, 4].map(die).join('') + '</div></div>';
    }
    return '<div class="ghead" style="--c:' + color(g.color) + '"><span class="wm suit" aria-hidden="true">' + suit(g.icon) + '</span>' + text + '</div>';
  }

  /* ---------- Landing ---------- */
  function renderLanding() {
    var h = '<header class="hero"><div class="gutter">' +
      '<div class="hero-nav"><span class="brand"><span class="brand-mark suit">♠︎</span>Brojanje igara</span>' +
      '<button class="ghost" data-action="start">Otvori</button></div>' +
      '<div class="hero-grid"><div>' +
      '<p class="eyebrow">Bez registracije</p>' +
      '<h1>Ko vodi? <em>Znaš odmah.</em></h1>' +
      '<p class="hero-sub">Brojač poena i pobjeda za Uno, Remi, Tablić i svaku drugu igru. Dodaj igrače, upiši rundu i gotovo.</p>' +
      '<button class="cta" data-action="start">Počni brojati ' + ICON.arrow + '</button>' +
      '<p class="hero-note">Besplatno, bez naloga i bez instalacije.</p></div>' +
      '<div class="hero-art" aria-hidden="true">' +
      '<div class="pcard c1">A<small>♠︎</small><i>♠︎</i></div>' +
      '<div class="pcard c2 red">K<small>♥︎</small><i>♥︎</i></div>' +
      '<div class="pcard c3">7<small>♣︎</small><i>♣︎</i></div>' +
      '<div class="mock"><div class="mock-head"><span>Uno</span><span>Runda 5</span></div>' +
      '<div class="mock-row lead"><span>Amra</span><b>312</b><span class="bar"><i style="width:62%"></i></span></div>' +
      '<div class="mock-row"><span>Tarik</span><b>245</b><span class="bar"><i style="width:49%"></i></span></div>' +
      '<div class="mock-row"><span>Lejla</span><b>180</b><span class="bar"><i style="width:36%"></i></span></div></div>' +
      '</div></div></div></header>';

    h += '<main class="gutter">' +
      '<section class="sec"><h2>Tri koraka do prve runde</h2>' +
      '<p class="sec-lede">Papir i olovka više nisu potrebni, a niko ne mora sabirati napamet.</p>' +
      '<ol class="steps">' +
      '<li><span class="n">1</span><h3>Izaberi igru</h3><p>Uno, Remi, Tablić, Belot ili Jamb su već podešeni. Svoju igru dodaš za par sekundi.</p></li>' +
      '<li><span class="n">2</span><h3>Dodaj igrače</h3><p>Upiši imena, koliko god vas ima za stolom.</p></li>' +
      '<li><span class="n">3</span><h3>Upiši rundu</h3><p>Aplikacija sabira, rangira i javlja ko je pobijedio.</p></li>' +
      '</ol></section>';

    h += '<section class="sec"><h2>Počni s igrom koju već igraš</h2>' +
      '<p class="sec-lede">Dodirni igru i pravila brojanja su već postavljena.</p><div class="picks">' +
      TEMPLATES.map(function (t, i) {
        return '<button class="pick" style="--c:' + color(t.color) + '" data-action="start" data-i="' + i + '">' +
          '<span class="wm suit" aria-hidden="true">' + suit(t.icon) + '</span><b>' + esc(t.name) + '</b><span class="how">' + esc(t.how) + '</span></button>';
      }).join('') + '</div></section>';

    h += '<section class="sec"><h2>Sve što treba za stolom</h2><div class="feats">' +
      feat('tally', 'Poeni ili pobjede', 'Sabiraj poene po rundama, i minus poene, ili samo dodaj +1 pobjedniku partije.') +
      feat('flag', 'Granica i pobjednik', 'Postavi do koliko se igra. Traka pokazuje ko je blizu, a pobjednik se proglasi sam.') +
      feat('undo', 'Greška se poništi', 'Pogrešan upis vratiš jednim dodirom ili obrišeš iz historije rundi.') +
      feat('lock', 'Bez naloga', 'Nema registracije ni lozinke. Rezultati se čuvaju samo na tvom uređaju.') +
      '</div></section>';

    h += '<section class="closer"><h2>Karte su podijeljene.</h2><p>Otvori brojač i upiši prvu rundu.</p>' +
      '<button class="cta" data-action="start">Počni brojati ' + ICON.arrow + '</button></section>' +
      '<p class="foot">Brojanje igara · besplatan brojač rezultata za kartaške i društvene igre</p></main>';
    return h;
  }
  function feat(icon, title, text) {
    return '<div class="feat"><span class="feat-ic">' + ICON[icon] + '</span><h3>' + title + '</h3><p>' + text + '</p></div>';
  }

  /* ---------- App views ---------- */
  function renderHome() {
    var n = state.games.length;
    var h = '<div class="wrap"><div class="nav">' +
      '<button class="brand" data-action="about" aria-label="O aplikaciji"><span class="brand-mark suit">♠︎</span>Brojanje igara</button>' +
      '<button class="round-btn" data-action="new-game" aria-label="Nova igra">' + ICON.plus + '</button></div>' +
      '<h1 class="page-title">Tvoje igre</h1>' +
      '<p class="lede">' + (n ? 'Dodirni igru da upišeš rezultat.' : 'Još nema igara. Dodaj prvu i počni brojati.') + '</p>' +
      '<div class="games">';
    state.games.forEach(function (g) {
      var st = standing(g);
      var status = st.winners.length ? 'Pobjednik: ' + names(st.winners)
        : st.leaders.length ? 'Vodi ' + names(st.leaders) + ' · ' + fmt(st.totals[st.leaders[0].id])
        : st.played ? 'Izjednačeno' : 'Još nema rezultata';
      h += '<button class="gcard gc-' + themeOf(g) + '" style="--c:' + color(g.color) + '" data-action="open-game" data-id="' + g.id + '">' +
        '<span class="wm suit" aria-hidden="true">' + suit(g.icon) + '</span>' +
        '<span class="gcard-top"><span class="gcard-ic suit" aria-hidden="true">' + suit(g.icon) + '</span>' + (g.example ? '<span class="badge">Primjer</span>' : '') + '</span>' +
        '<span class="gcard-name">' + esc(g.name) + '</span>' +
        '<span class="gcard-meta">' + players(g.players.length) + '</span>' +
        '<span class="gcard-status">' + esc(status) + '</span></button>';
    });
    h += '<button class="gcard new" data-action="new-game"><span class="plus">' + ICON.plus + '</span>Nova igra</button></div>';
    if (state.games.some(function (g) { return g.example; })) {
      h += '<p class="footnote">Igra s oznakom Primjer ima izmišljene igrače. Uredi je ili obriši kad dodaš svoju.</p>';
    }
    return h + '</div>';
  }

  function renderGame(g) {
    var st = standing(g);
    var wins = g.mode === 'wins';
    var theme = themeOf(g);
    var h = '<div class="wrap"><div class="nav"><button class="nav-btn" data-action="home">' + ICON.back + ' Igre</button>' +
      '<button class="nav-btn" data-action="edit-game">Uredi</button></div>' +
      ghead(g, theme);

    if (st.winners.length) {
      h += '<div class="banner"><span class="banner-crown">' + ICON.crown + '</span><div style="min-width:0">' +
        '<div class="banner-title">' + esc(names(st.winners)) + (st.winners.length > 1 ? ' dijele pobjedu' : ' pobjeđuje') + '</div>' +
        '<div class="banner-sub">' + fmt(st.totals[st.winners[0].id]) + (wins ? ' pobjeda' : ' poena') + '. Za novu partiju obriši rezultate ispod.</div></div></div>';
    }

    h += '<div class="group">';
    g.players.forEach(function (p, i) {
      var tot = st.totals[p.id];
      var first = st.leaders.length > 0 && st.rank[p.id] === 1;
      h += '<div class="row' + (first ? ' leader' : '') + '"><span class="rank' + (first ? ' first' : '') + '">' + (st.played ? st.rank[p.id] : '–') + '</span>' +
        avatar(theme, i, p.name) +
        '<span class="row-main"><span class="row-title" style="display:block">' + esc(p.name) + '</span>';
      if (g.target) {
        var pct = Math.max(0, Math.min(100, tot / g.target * 100));
        h += '<span class="progress" style="display:block;--c:' + (theme === 'colors' ? QUAD[i % 4][0] : theme === 'plain' ? color(g.color) : 'var(--accent)') + '"><i style="width:' + pct + '%"></i></span>';
      }
      h += '</span><span class="total">' + fmt(tot) + '</span>';
      if (wins) h += '<button class="plus-one" data-action="add-win" data-pid="' + p.id + '" aria-label="Pobjeda za ' + esc(p.name) + '">+1</button>';
      h += '</div>';
    });
    h += '</div>';

    if (!wins) h += '<button class="btn" data-action="new-round">' + ICON.plus + ' Upiši rundu</button>';
    else h += '<p class="footnote">Dodirni +1 kod igrača koji je dobio partiju.</p>';

    if (g.rounds.length) {
      h += '<div class="section-label">' + (wins ? 'Partije' : 'Runde') + '</div><div class="group">';
      for (var i = g.rounds.length - 1; i >= 0; i--) {
        var r = g.rounds[i];
        var chips = g.players.filter(function (p) { return r.scores[p.id]; }).map(function (p) {
          var v = r.scores[p.id];
          return '<span class="chip">' + esc(p.name) + (wins ? '' : ' <b' + (v < 0 ? ' class="neg"' : '') + '>' + signed(v) + '</b>') + '</span>';
        }).join('');
        h += '<div class="row hist"><div class="row-main"><div class="hist-title">' + (wins ? 'Partija ' : 'Runda ') + (i + 1) + (wins ? ' · pobjeda' : '') + '</div>' +
          '<div class="chips">' + chips + '</div></div>' +
          '<button class="del" data-action="del-round" data-rid="' + r.id + '" aria-label="Obriši ' + (wins ? 'partiju ' : 'rundu ') + (i + 1) + '">' + ICON.x + '</button></div>';
      }
      h += '</div><button class="btn danger-text" data-action="ask-reset">Obriši rezultate i počni ispočetka</button>';
    }
    return h + '</div>';
  }

  function render() {
    var g = view.page === 'game' ? game(view.gameId) : null;
    if (view.page === 'game' && !g) view = { page: 'home', gameId: null };
    document.body.classList.toggle('on-landing', view.page === 'landing');
    THEMES.forEach(function (t) { document.body.classList.toggle('t-' + t[0], !!g && t[0] !== 'plain' && themeOf(g) === t[0]); });
    document.getElementById('app').innerHTML = view.page === 'landing' ? renderLanding() : g ? renderGame(g) : renderHome();
  }

  /* ---------- Sheets ---------- */
  function seg(action, value, options) {
    return '<div class="seg">' + options.map(function (o) {
      return '<button type="button" data-action="' + action + '" data-v="' + o[0] + '" aria-pressed="' + (o[0] === value) + '">' + o[1] + '</button>';
    }).join('') + '</div>';
  }

  function renderGameForm(d) {
    var h = '<form class="sheet" id="game-form" role="dialog" aria-modal="true" aria-labelledby="sheet-title" novalidate>' +
      '<div class="sheet-bar"><button type="button" class="nav-btn" data-action="close-sheet">Odustani</button>' +
      '<h2 id="sheet-title">' + (d.id ? 'Uredi igru' : 'Nova igra') + '</h2>' +
      '<button type="submit" class="nav-btn">Sačuvaj</button></div>';

    if (!d.id) {
      h += '<div class="section-label">Brzi izbor</div><div class="tpl">' + TEMPLATES.map(function (t, i) {
        return '<button type="button" data-action="use-template" data-i="' + i + '">' + tile(t) + esc(t.name) + '</button>';
      }).join('') + '</div>';
    }

    h += '<div class="section-label">Igra</div><div class="group">' +
      '<div class="field"><input id="f-name" type="text" maxlength="40" autocomplete="off" placeholder="Naziv igre" aria-label="Naziv igre" value="' + esc(d.name) + '"></div>' +
      '<div class="swatches">' + COLORS.map(function (c, i) {
        return '<button type="button" class="swatch" style="--c:' + c + '" data-action="set-color" data-v="' + i + '" aria-pressed="' + (i === d.color) + '" aria-label="Boja ' + (i + 1) + '"></button>';
      }).join('') + '</div>' +
      '<div class="swatches" style="padding-top:0">' + ICONS.map(function (ic, i) {
        return '<button type="button" class="swatch icon" data-action="set-icon" data-v="' + i + '" aria-pressed="' + (i === d.icon) + '" aria-label="Znak ' + (i + 1) + '">' + suit(i) + '</button>';
      }).join('') + '</div></div>';

    var cur = d.theme || inferTheme(d.name);
    h += '<div class="section-label">Stil igre</div><div class="tpl pick-theme">' + THEMES.map(function (t) {
      return '<button type="button" data-action="set-theme" data-v="' + t[0] + '" aria-pressed="' + (t[0] === cur) + '">' + t[1] + '</button>';
    }).join('') + '</div>';

    h += '<div class="section-label">Brojanje</div>' + seg('set-mode', d.mode, [['points', 'Poeni'], ['wins', 'Pobjede']]);
    if (d.mode === 'points') {
      h += '<div class="seg-block">' + seg('set-win', d.win, [['high', 'Pobjeđuje najviše'], ['low', 'Pobjeđuje najmanje']]) + '</div>';
    }
    h += '<div class="group" style="margin-top:10px"><div class="field"><label for="f-target">' +
      (d.mode === 'wins' ? 'Igra se do pobjeda' : (d.win === 'low' ? 'Kraj kad neko skupi' : 'Igra se do poena')) + '</label>' +
      '<input id="f-target" class="num" type="text" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="Bez granice" value="' + esc(d.target) + '"></div></div>';

    h += '<div class="section-label">Igrači</div><div class="group">';
    d.players.forEach(function (p, i) {
      h += '<div class="field"><span class="avatar sm" style="--c:' + color(i) + '" aria-hidden="true">' + (i + 1) + '</span>' +
        '<input type="text" id="f-p-' + p.id + '" data-pid="' + p.id + '" maxlength="24" autocomplete="off" enterkeyhint="next" placeholder="Ime igrača" aria-label="Ime igrača ' + (i + 1) + '" value="' + esc(p.name) + '">' +
        '<button type="button" class="del" data-action="remove-player" data-pid="' + p.id + '" aria-label="Ukloni igrača ' + (i + 1) + '">' + ICON.x + '</button></div>';
    });
    h += '<button type="button" class="field add-row" data-action="add-player" style="width:100%">Dodaj igrača</button></div>';

    var known = knownNames(d);
    if (known.length) {
      h += '<div class="suggest">' + known.map(function (n) {
        return '<button type="button" data-action="suggest-player" data-name="' + esc(n) + '">+ ' + esc(n) + '</button>';
      }).join('') + '</div>';
    }
    if (d.error) h += '<p class="error" role="alert">' + esc(d.error) + '</p>';
    h += '<button type="submit" class="btn" style="margin-top:24px">' + (d.id ? 'Sačuvaj izmjene' : 'Napravi igru') + '</button>';
    if (d.id) h += '<button type="button" class="btn danger-text" data-action="ask-delete" style="margin-top:6px">Obriši igru</button>';
    return h + '</form>';
  }

  function knownNames(d) {
    var have = {};
    d.players.forEach(function (p) { have[p.name.trim().toLowerCase()] = 1; });
    var out = [];
    state.games.forEach(function (g) {
      if (g.example) return;
      g.players.forEach(function (p) {
        var k = p.name.trim().toLowerCase();
        if (!have[k]) { have[k] = 1; out.push(p.name); }
      });
    });
    return out.slice(0, 8);
  }

  function renderRoundForm(d) {
    var g = game(d.gameId);
    var theme = themeOf(g);
    var h = '<form class="sheet" id="round-form" role="dialog" aria-modal="true" aria-labelledby="sheet-title" novalidate>' +
      '<div class="sheet-bar"><button type="button" class="nav-btn" data-action="close-sheet">Odustani</button>' +
      '<h2 id="sheet-title">Runda ' + (g.rounds.length + 1) + '</h2>' +
      '<button type="submit" class="nav-btn">Sačuvaj</button></div>' +
      '<div class="group">';
    g.players.forEach(function (p, i) {
      h += '<div class="field">' + avatar(theme, i, p.name || '?', true) +
        '<label class="who" for="r-' + p.id + '">' + esc(p.name) + '</label>' +
        '<button type="button" class="sign" data-action="flip-sign" data-pid="' + p.id + '" aria-label="Promijeni predznak za ' + esc(p.name) + '">±</button>' +
        '<input class="pts" id="r-' + p.id + '" data-pid="' + p.id + '" type="text" inputmode="numeric" maxlength="7" autocomplete="off" placeholder="0" value="' + esc(d.values[p.id] || '') + '"></div>';
    });
    h += '</div><p class="footnote">Prazno polje znači 0. Dugme ± mijenja poene u minus.</p>';
    if (d.error) h += '<p class="error" role="alert">' + esc(d.error) + '</p>';
    return h + '<button type="submit" class="btn">Sačuvaj rundu</button></form>';
  }

  function renderConfirm(d) {
    return '<div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="sheet-title">' +
      '<div class="sheet-bar"><span></span><h2 id="sheet-title">' + esc(d.title) + '</h2><span></span></div>' +
      '<p class="confirm-text">' + esc(d.text) + '</p>' +
      '<button class="btn danger" data-action="' + d.yes + '">' + esc(d.label) + '</button>' +
      '<button class="btn gray" data-action="' + (d.back || 'close-sheet') + '" style="margin-top:10px">Odustani</button></div>';
  }

  function renderSheet(focusId) {
    var root = document.getElementById('sheet-root');
    document.documentElement.classList.toggle('locked', !!sheet);
    if (!sheet) { root.innerHTML = ''; return; }
    var scroll = root.querySelector('.sheet') ? root.querySelector('.sheet').scrollTop : 0;
    var inner = sheet.type === 'game' ? renderGameForm(sheet) : sheet.type === 'round' ? renderRoundForm(sheet) : renderConfirm(sheet);
    var fresh = !root.firstChild;
    root.innerHTML = '<div class="backdrop" data-backdrop>' + inner + '</div>';
    if (!fresh) {
      root.querySelector('.backdrop').style.animation = 'none';
      root.querySelector('.sheet').style.animation = 'none';
      root.querySelector('.sheet').scrollTop = scroll;
    }
    var el = focusId ? document.getElementById(focusId) : null;
    if (el) { el.focus(); if (el.select && focusId.indexOf('f-p-') !== 0) el.select(); }
  }

  /* Read whatever is typed in the open form back into the draft before re-rendering it. */
  function syncDraft() {
    if (!sheet) return;
    if (sheet.type === 'game') {
      var n = document.getElementById('f-name'), t = document.getElementById('f-target');
      if (n) sheet.name = n.value;
      if (t) sheet.target = t.value;
      sheet.players.forEach(function (p) {
        var el = document.getElementById('f-p-' + p.id);
        if (el) p.name = el.value;
      });
    } else if (sheet.type === 'round') {
      game(sheet.gameId).players.forEach(function (p) {
        var el = document.getElementById('r-' + p.id);
        if (el) sheet.values[p.id] = el.value;
      });
    }
    sheet.error = '';
  }

  function parseNum(s) {
    s = String(s || '').replace(/−/g, '-').replace(/[^\d-]/g, '');
    if (!/^-?\d+$/.test(s)) return 0;
    return parseInt(s, 10);
  }

  /* ---------- Toast ---------- */
  function showToast(text, undo) {
    toast = { text: text, undo: undo || null };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast = null; renderToast(); }, 4500);
    renderToast();
  }
  function renderToast() {
    document.getElementById('toast-root').innerHTML = toast
      ? '<div class="toast"><span>' + esc(toast.text) + '</span>' + (toast.undo ? '<button data-action="undo">Poništi</button>' : '') + '</div>'
      : '';
  }

  /* ---------- Actions ---------- */
  function blankPlayers() { return [{ id: uid(), name: '' }, { id: uid(), name: '' }]; }
  function newDraft() {
    return { type: 'game', id: null, theme: null, name: '', icon: 0, color: 3, mode: 'points', win: 'high', target: '', players: blankPlayers(), error: '' };
  }
  function applyTemplate(d, t) {
    d.name = t.name; d.theme = t.theme; d.icon = t.icon; d.color = t.color; d.mode = t.mode; d.win = t.win; d.target = t.target ? String(t.target) : '';
  }

  function saveGame() {
    syncDraft();
    var d = sheet;
    var name = d.name.trim();
    var list = d.players.map(function (p) { return { id: p.id, name: p.name.trim() }; }).filter(function (p) { return p.name; });
    if (!name) { d.error = 'Upiši naziv igre.'; return renderSheet('f-name'); }
    if (!list.length) { d.error = 'Dodaj bar jednog igrača.'; return renderSheet(d.players[0] ? 'f-p-' + d.players[0].id : null); }
    var target = Math.abs(parseNum(d.target)) || '';
    var g = d.id ? game(d.id) : null;
    if (g) {
      var keep = {};
      list.forEach(function (p) { keep[p.id] = 1; });
      g.rounds.forEach(function (r) {
        Object.keys(r.scores).forEach(function (pid) { if (!keep[pid]) delete r.scores[pid]; });
      });
      g.rounds = g.rounds.filter(function (r) { return Object.keys(r.scores).length; });
      if (g.mode !== d.mode) g.rounds = [];
      g.name = name; g.theme = d.theme || inferTheme(name); g.icon = d.icon; g.color = d.color; g.mode = d.mode; g.win = d.win; g.target = target; g.players = list;
      delete g.example;
    } else {
      g = { id: uid(), name: name, theme: d.theme || inferTheme(name), icon: d.icon, color: d.color, mode: d.mode, win: d.win, target: target, players: list, rounds: [] };
      state.games.unshift(g);
      view = { page: 'game', gameId: g.id };
    }
    save(); sheet = null; renderSheet(); render();
    window.scrollTo(0, 0);
  }

  function saveRound() {
    syncDraft();
    var g = game(sheet.gameId);
    var scores = {};
    g.players.forEach(function (p) {
      var v = parseNum(sheet.values[p.id]);
      if (v) scores[p.id] = v;
    });
    if (!Object.keys(scores).length) {
      sheet.error = 'Upiši poene bar za jednog igrača.';
      return renderSheet('r-' + g.players[0].id);
    }
    var r = { id: uid(), scores: scores };
    g.rounds.push(r);
    save(); sheet = null; renderSheet(); render();
    showToast('Runda ' + g.rounds.length + ' upisana', { type: 'remove', gameId: g.id, roundId: r.id });
  }

  function removeRound(g, rid) {
    var i = -1;
    g.rounds.forEach(function (r, k) { if (r.id === rid) i = k; });
    if (i < 0) return null;
    return { round: g.rounds.splice(i, 1)[0], index: i };
  }

  var actions = {
    'start': function (el) {
      write(SEEN, '1');
      view = { page: 'home', gameId: null }; render(); window.scrollTo(0, 0);
      if (el.dataset.i !== undefined) {
        sheet = newDraft();
        applyTemplate(sheet, TEMPLATES[+el.dataset.i]);
        renderSheet('f-p-' + sheet.players[0].id);
      }
    },
    'about': function () { view = { page: 'landing', gameId: null }; render(); window.scrollTo(0, 0); },
    'home': function () { view = { page: 'home', gameId: null }; render(); window.scrollTo(0, 0); },
    'open-game': function (el) { view = { page: 'game', gameId: el.dataset.id }; render(); window.scrollTo(0, 0); },
    'new-game': function () { sheet = newDraft(); renderSheet('f-name'); },
    'edit-game': function () {
      var g = game(view.gameId);
      sheet = {
        type: 'game', id: g.id, theme: themeOf(g), name: g.name, icon: g.icon, color: g.color, mode: g.mode, win: g.win, target: g.target ? String(g.target) : '',
        players: g.players.map(function (p) { return { id: p.id, name: p.name }; }), error: ''
      };
      renderSheet();
    },
    'use-template': function (el) {
      syncDraft();
      applyTemplate(sheet, TEMPLATES[+el.dataset.i]);
      renderSheet(sheet.players[0] ? 'f-p-' + sheet.players[0].id : null);
    },
    'set-theme': function (el) { syncDraft(); sheet.theme = el.dataset.v; renderSheet(); },
    'set-color': function (el) { syncDraft(); sheet.color = +el.dataset.v; renderSheet(); },
    'set-icon': function (el) { syncDraft(); sheet.icon = +el.dataset.v; renderSheet(); },
    'set-mode': function (el) { syncDraft(); sheet.mode = el.dataset.v; renderSheet(); },
    'set-win': function (el) { syncDraft(); sheet.win = el.dataset.v; renderSheet(); },
    'add-player': function () {
      syncDraft();
      var p = { id: uid(), name: '' };
      sheet.players.push(p);
      renderSheet('f-p-' + p.id);
    },
    'suggest-player': function (el) {
      syncDraft();
      var empty = sheet.players.filter(function (p) { return !p.name.trim(); })[0];
      if (empty) empty.name = el.dataset.name; else sheet.players.push({ id: uid(), name: el.dataset.name });
      renderSheet();
    },
    'remove-player': function (el) {
      syncDraft();
      sheet.players = sheet.players.filter(function (p) { return p.id !== el.dataset.pid; });
      renderSheet();
    },
    'close-sheet': function () { sheet = null; renderSheet(); },
    'new-round': function () {
      var g = game(view.gameId);
      sheet = { type: 'round', gameId: g.id, values: {}, error: '' };
      renderSheet('r-' + g.players[0].id);
    },
    'flip-sign': function (el) {
      var input = document.getElementById('r-' + el.dataset.pid);
      var v = input.value.trim().replace(/−/g, '-');
      input.value = v.charAt(0) === '-' ? v.slice(1) : '-' + v;
      input.focus();
    },
    'add-win': function (el) {
      var g = game(view.gameId);
      var r = { id: uid(), scores: one(el.dataset.pid, 1) };
      g.rounds.push(r);
      save(); render();
      var p = g.players.filter(function (x) { return x.id === el.dataset.pid; })[0];
      showToast('Pobjeda: ' + p.name, { type: 'remove', gameId: g.id, roundId: r.id });
    },
    'del-round': function (el) {
      var g = game(view.gameId);
      var out = removeRound(g, el.dataset.rid);
      if (!out) return;
      save(); render();
      showToast(g.mode === 'wins' ? 'Partija obrisana' : 'Runda obrisana', { type: 'restore', gameId: g.id, round: out.round, index: out.index });
    },
    'undo': function () {
      var u = toast && toast.undo;
      toast = null; clearTimeout(toastTimer); renderToast();
      if (!u) return;
      var g = game(u.gameId);
      if (!g) return;
      if (u.type === 'remove') removeRound(g, u.roundId);
      else if (u.type === 'restore') g.rounds.splice(Math.min(u.index, g.rounds.length), 0, u.round);
      else if (u.type === 'rounds') g.rounds = u.rounds;
      save(); render();
    },
    'ask-reset': function () {
      sheet = { type: 'confirm', title: 'Obrisati rezultate?', text: 'Igrači ostaju, a svi upisani rezultati se brišu.', label: 'Obriši rezultate', yes: 'reset' };
      renderSheet();
    },
    'reset': function () {
      var g = game(view.gameId);
      var old = g.rounds;
      g.rounds = []; delete g.example;
      save(); sheet = null; renderSheet(); render();
      showToast('Rezultati obrisani', { type: 'rounds', gameId: g.id, rounds: old });
    },
    'ask-delete': function () {
      syncDraft();
      var draft = sheet;
      sheet = { type: 'confirm', title: 'Obrisati igru?', text: 'Igra „' + game(draft.id).name + '“ i svi njeni rezultati se trajno brišu.', label: 'Obriši igru', yes: 'delete-game', back: 'back-to-edit', draft: draft };
      renderSheet();
    },
    'back-to-edit': function () { sheet = sheet.draft; renderSheet(); },
    'delete-game': function () {
      var id = sheet.draft.id;
      state.games = state.games.filter(function (g) { return g.id !== id; });
      save(); sheet = null; view = { page: 'home', gameId: null };
      renderSheet(); render();
      showToast('Igra obrisana');
    }
  };

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (el) { actions[el.dataset.action](el); return; }
    if (e.target.hasAttribute && e.target.hasAttribute('data-backdrop') && sheet && sheet.type === 'confirm') {
      actions[sheet.back || 'close-sheet']();
    }
  });
  document.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'game-form') saveGame();
    else if (e.target.id === 'round-form') saveRound();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sheet) { actions[sheet.back || 'close-sheet'](); return; }
    /* Enter in a player name moves to the next player, adding a row after the last one. */
    if (e.key === 'Enter' && sheet && sheet.type === 'game' && e.target.id && e.target.id.indexOf('f-p-') === 0) {
      e.preventDefault();
      var ids = sheet.players.map(function (p) { return p.id; });
      var next = ids[ids.indexOf(e.target.dataset.pid) + 1];
      if (next) document.getElementById('f-p-' + next).focus();
      else if (e.target.value.trim()) actions['add-player']();
    }
  });

  render(); renderSheet(); renderToast();
})();
</script>
</body>
</html>
